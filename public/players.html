<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Players | Apex Elite FC</title><meta name="description" content="Meet the player profiles of Apex Elite Football Club."><meta name="robots" content="index,follow"><style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.6 Arial,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:22px}a{color:#f5dfb4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:#1a1515;border:1px solid #70513b;border-radius:14px;padding:18px}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}h1,h2{color:#f5dfb4}</style></head><body><header><a href="/">APEX ELITE FC</a></header><main><h1>Player Profiles</h1><div id="players" class="grid">Loading player profiles…</div></main><footer><a href="/">Return to homepage</a></footer><script>
(async()=>{const root=document.getElementById('players');try{const r=await fetch('/api/site');if(!r.ok)throw 0;const d=await r.json(),a=d.playerProfiles||[];root.innerHTML=a.length?a.map(p=>'<article class="card">'+(p.photo?'<img loading="lazy" src="'+esc(p.photo)+'" alt="'+esc(p.photoAlt||p.name)+'">':'')+'<h2>'+esc(p.name)+'</h2><p>'+esc(p.position||'')+'</p><a href="/players/'+encodeURIComponent(p.slug)+'">View profile</a></article>').join(''):'<p>Player profiles will be published here soon.</p>';}catch(e){root.textContent='Player profiles are temporarily unavailable.';}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}})();
</script></body></html>
