<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apex Elite FC Coach Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.5 system-ui,sans-serif}
.box{max-width:26rem;margin:10vh auto;padding:1.4rem;text-align:center}
input,select,textarea,button{font:inherit;padding:.65rem .8rem;border-radius:.5rem;border:1px solid #6b5a52;background:#241b1a;color:#f6ebe6;width:100%;margin:.35rem 0}
button{width:auto;background:#d9301f;border:0;cursor:pointer;color:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;background:#1a1515;position:sticky;top:0}
main{padding:1rem;max-width:70rem;margin:auto}.tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:1rem}
.tabs button{background:transparent;border:1px solid #f5dfb4;color:#f5dfb4}
.tabs button.on{background:#d9301f;color:#fff;border-color:#d9301f}
.note{color:#c4b1ab;font-size:.9rem}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:32rem}
td,th{text-align:left;padding:.55rem;border-bottom:1px solid #3a302d}
label{display:block;margin-top:.6rem;color:#c4b1ab;font-size:.9rem}
</style>
</head>
<body>
<div id="login" class="box">
<h1>Apex Elite FC</h1><h2>Coach Admin</h2>
<p class="note">Access for players, player SEO profiles and team formations only.</p>
<input id="code" type="password" autocomplete="current-password" placeholder="Coach access code">
<button onclick="login()">Sign in</button><p id="message" role="status"></p>
</div>
<div id="app" hidden>
<header><b>Apex Elite FC · Coach Admin</b><button onclick="logout()">Log out</button></header>
<nav class="tabs" id="tabs"></nav><main id="view"></main>
</div>
<script>
let code=sessionStorage.getItem("coachAccess")||"",state=null,tab="players";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(action,data={}) {
 const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,action,data})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok) throw Error(j.error||"Request failed");
 state=j;return j;
}
async function login(){code=$("code").value;try{await api("load");if(state.role!=="coach")throw Error("This code is not a Coach Admin code.");sessionStorage.setItem("coachAccess",code);$("login").hidden=true;$("app").hidden=false;render()}catch(e){$("message").textContent=e.message}}
function logout(){sessionStorage.removeItem("coachAccess");location.reload()}
async function act(action,data){try{await api(action,data);render()}catch(e){alert(e.message)}}
function render(){
 const allowed=[["players","Players"],["seo","Player SEO"],["squad","Formations & Lineup"]];
 $("tabs").innerHTML=allowed.map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${n}</button>`).join("");
 if(tab==="players") $("view").innerHTML=playersView();
 if(tab==="seo") $("view").innerHTML=seoView();
 if(tab==="squad") $("view").innerHTML=squadView();
}
function playersView(){
 return `<h2>Players</h2><p class="note">You can update player status. Player deletion and payments are reserved for the main admin.</p><div class="sc"><table><tr><th>ID</th><th>Player</th><th>Group</th><th>Status</th></tr>${(state.players||[]).map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.name)}<br>${esc(p.pos||"")}</td><td>${esc(p.grp)}</td><td><select onchange="act('player',{id:'${esc(p.id)}',st:this.value})">${["Trial","Recruited","Not selected"].map(s=>`<option ${p.st===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||"<tr><td colspan='4'>No players found.</td></tr>"}</table></div>`;
}
function seoView(){
 const a=state.playerProfiles||[];
 return `<h2>Player SEO Profiles</h2><p class="note">Create or update player profile pages, titles and search descriptions. Deleting profiles is reserved for the main admin.</p>
 <input id="pid" type="hidden"><label>Player name</label><input id="pname" placeholder="Player full name">
 <label>Profile URL slug</label><input id="pslug" placeholder="e.g. john-doe">
 <label>Position</label><input id="position" placeholder="e.g. Striker">
 <label>Squad number</label><input id="number" placeholder="e.g. 10">
 <label>Team / age group</label><input id="team" placeholder="e.g. U16">
 <label>Biography</label><textarea id="bio" rows="4"></textarea>
 <label>Player photo URL</label><input id="photo" placeholder="https://...">
 <label>Photo alt text</label><input id="photoAlt">
 <label>SEO title</label><input id="seoTitle">
 <label>Meta description</label><textarea id="metaDescription" rows="3"></textarea>
 <label><input id="published" type="checkbox" checked style="width:auto"> Publish profile</label>
 <button onclick="saveProfile()">Save player profile</button><button onclick="clearProfile()">Clear form</button>
 <h3>Saved profiles</h3><div class="sc"><table><tr><th>Player</th><th>URL</th><th>Status</th><th></th></tr>${a.map(p=>`<tr><td>${esc(p.name)}</td><td>/players/${esc(p.slug)}</td><td>${p.published?"Published":"Draft"}</td><td><button onclick="editProfile('${esc(p.id)}')">Edit</button></td></tr>`).join("")||"<tr><td colspan='4'>No profiles yet.</td></tr>"}</table></div>`;
}
function editProfile(id){const p=(state.playerProfiles||[]).find(x=>x.id===id);if(!p)return;$("pid").value=p.id;$("pname").value=p.name||"";$("pslug").value=p.slug||"";$("position").value=p.position||"";$("number").value=p.number||"";$("team").value=p.team||"";$("bio").value=p.bio||"";$("photo").value=p.photo||"";$("photoAlt").value=p.photoAlt||"";$("seoTitle").value=p.seoTitle||"";$("metaDescription").value=p.metaDescription||"";$("published").checked=!!p.published;window.scrollTo(0,0)}
function clearProfile(){["pid","pname","pslug","position","number","team","bio","photo","photoAlt","seoTitle","metaDescription"].forEach(k=>$(k).value="");$("published").checked=true}
async function saveProfile(){await act("playerProfile",{id:$("pid").value,name:$("pname").value,slug:$("pslug").value,position:$("position").value,number:$("number").value,team:$("team").value,bio:$("bio").value,photo:$("photo").value,photoAlt:$("photoAlt").value,seoTitle:$("seoTitle").value,metaDescription:$("metaDescription").value,published:$("published").checked})}
function squadView(){
 const q=state.squad||{formation:"4-3-3",coach:"",lineup:[]};
 return `<h2>Formations & Lineup</h2><p class="note">Create player SEO profiles first. Use one player per line: profile-slug | position | starter/sub.</p>
 <label>Formation</label><select id="formation">${["4-3-3","4-4-2","4-2-3-1","3-5-2","3-4-3","4-1-4-1"].map(f=>`<option ${q.formation===f?"selected":""}>${f}</option>`).join("")}</select>
 <label>Head coach</label><input id="coachName" value="${esc(q.coach||"")}">
 <label>Lineup entries</label><textarea id="lines" rows="12">${esc((q.lineup||[]).map(x=>`${x.slug} | ${x.role} | ${x.status}`).join("\n"))}</textarea>
 <button onclick="saveSquad()">Save formation & lineup</button><p class="note"><a href="/squad.html" target="_blank">Preview public squad page</a></p>`;
}
function parseLines(){return $("lines").value.split("\n").map(x=>x.split("|").map(v=>v.trim())).filter(x=>x[0]).map(x=>({slug:x[0],role:x[1]||"",status:(x[2]||"starter").toLowerCase()}))}
async function saveSquad(){await act("squad",{formation:$("formation").value,coach:$("coachName").value,lines:parseLines()})}
if(code){$("code").value=code;login()}
</script>
</body></html>
