<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search Apex Elite Football Club players, news, products and club information.">
<meta name="robots" content="index,follow">
<title>Search | Apex Elite FC</title>
<style>
:root{--red:#e2321f;--gold:#f5dfb4;--ink:#0d0b0b;--panel:#1a1515;--fg:#f6ebe6;--mut:#c4b1ab}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(90% 50% at 50% 0,#3a0e0a 0,var(--ink) 70%);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{width:min(900px,92%);margin:7vh auto}.brand{font-weight:900;letter-spacing:.12em;color:var(--gold)}
h1{font-size:clamp(2.3rem,7vw,4rem);margin:.4rem 0}.muted{color:var(--mut)}
form{display:flex;gap:.6rem;margin:2rem 0}input,button{font:inherit;border-radius:10px;padding:.9rem 1rem}
input{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid #58443c}
button{background:var(--red);border:0;color:white;font-weight:800;cursor:pointer}
#status{min-height:1.6rem;color:var(--gold)}.result{display:block;text-decoration:none;color:var(--fg);padding:1rem;margin:.7rem 0;border:1px solid #493932;border-radius:12px;background:var(--panel)}
.result:hover{border-color:var(--gold)}.kind{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.result h2{font-size:1.2rem;margin:.2rem 0}.result p{margin:.2rem 0;color:var(--mut)}
a.back{color:var(--gold)}@media(max-width:560px){form{flex-direction:column}button{width:100%}}
</style>
</head>
<body><main>
<div class="brand">APEX ELITE FC</div>
<h1>Search the club</h1>
<p class="muted">Find published player profiles, news, products, sponsors and club sections.</p>
<form id="searchForm"><input id="query" type="search" placeholder="Search players, news, shop..." autocomplete="off" required><button type="submit">Search</button></form>
<div id="status" role="status" aria-live="polite">Loading club information…</div>
<section id="results" aria-label="Search results"></section>
<p><a class="back" href="/">← Back to homepage</a></p>
</main><script src="/search.js" defer></script></body></html>
