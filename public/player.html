<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Player Profile | Apex Elite FC</title><meta name="description" content="Player profile at Apex Elite Football Club."><meta property="og:type" content="profile"><meta property="og:title" content="Apex Elite FC Player"><meta property="og:description" content="Player profile at Apex Elite FC."><style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1050px;margin:auto;padding:22px}a{color:#f5dfb4}.hero{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:28px;align-items:center;background:#1a1515;border:1px solid #70513b;border-radius:18px;padding:22px}.hero img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.eyebrow{color:#e8bd7b;text-transform:uppercase;letter-spacing:.15em}h1,h2{color:#f5dfb4;text-transform:uppercase;line-height:1.05}h1{font-size:clamp(2rem,7vw,4rem);margin:.3em 0}.number{font-size:2rem;color:#e2321f;font-weight:800}.bio{white-space:pre-wrap;color:#d8c8c1}@media(max-width:650px){.hero{grid-template-columns:1fr}}</style></head><body><header><a href="/">APEX ELITE FC</a></header><main id="profile"><p>Loading player profile…</p></main><footer><a href="/players.html">All player profiles</a> · <a href="/">Home</a></footer><script>
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const slug=new URLSearchParams(location.search).get('slug')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const host=document.getElementById('profile');try{const r=await fetch('/api/player?slug='+encodeURIComponent(slug));if(!r.ok)throw Error('Player profile not found');const p=await r.json();document.title=p.seoTitle||p.name+' | Apex Elite FC';document.querySelector('meta[name="description"]').content=p.metaDescription||'';document.querySelector('meta[property="og:title"]').content=document.title;document.querySelector('meta[property="og:description"]').content=p.metaDescription||'';host.innerHTML='<article class="hero">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="'+esc(p.photoAlt||p.name)+'">':'<div class="number">#'+esc(p.number||'—')+'</div>')+'<div><div class="eyebrow">Apex Elite FC · '+esc(p.team||'Academy')+'</div><h1>'+esc(p.name)+'</h1><p class="number">'+(p.number?'#'+esc(p.number)+' · ':'')+esc(p.position)+'</p><p class="bio">'+esc(p.bio)+'</p></div></article>';}catch(e){host.textContent='This player profile is unavailable or has not been published.';}})();
</script></body></html>
