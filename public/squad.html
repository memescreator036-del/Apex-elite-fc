<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Team Squad | Apex Elite FC</title><meta name="description" content="Meet the Apex Elite FC squad and coach-selected lineup."><style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.5 system-ui,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:20px}a{color:#f5dfb4}h1,h2{color:#f5dfb4;text-transform:uppercase}.meta{color:#c4b1ab}.pitch{position:relative;min-height:610px;border:3px solid #e8d3a7;border-radius:18px;background:repeating-linear-gradient(0deg,#174c32 0,#174c32 60px,#1b5839 60px,#1b5839 120px);overflow:hidden;padding:25px 10px}.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #e8d3a7}.pitch:after{content:"";position:absolute;width:140px;height:140px;border:2px solid #e8d3a7;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.lineup{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-around;min-height:550px;gap:12px}.line{display:flex;justify-content:space-evenly;gap:8px;flex-wrap:wrap}.player{width:100px;text-align:center;text-decoration:none;color:white;text-shadow:0 1px 3px #000}.shirt{width:48px;height:48px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#e2321f;border:2px solid #f5dfb4;font-weight:800;box-shadow:0 4px 12px #0008}.player small{display:block;font-size:12px}.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px}.sub{background:#1a1515;border:1px solid #70513b;padding:12px;border-radius:10px}.empty{padding:30px;text-align:center;background:#1a1515;border-radius:12px}@media(max-width:600px){.pitch{min-height:570px}.lineup{min-height:510px}.player{width:76px}.shirt{width:42px;height:42px}}</style></head><body><header><a href="/">APEX ELITE FC</a></header><main><h1>First Team Squad</h1><p id="coach" class="meta">Coach-selected lineup</p><div id="pitch" class="pitch"><div class="lineup" id="lineup"><p>Loading squad…</p></div></div><h2>Substitutes</h2><div class="subs" id="subs"></div><h2>Player directory</h2><p><a href="/players.html">Browse all player profiles</a></p></main><footer><a href="/">Return to homepage</a></footer><script>
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const pitch=document.getElementById('lineup'),subs=document.getElementById('subs');try{const r=await fetch('/api/site');if(!r.ok)throw 0;const d=await r.json(),q=d.squad||{},profiles=d.playerProfiles||[],items=(q.lineup||[]).map(x=>({...x,p:profiles.find(p=>p.slug===x.slug)})).filter(x=>x.p);document.getElementById('coach').textContent=(q.coach?'Head Coach: '+q.coach+' · ':'')+'Formation: '+(q.formation||'4-3-3');const starters=items.filter(x=>x.status!=='sub'),groups={GK:[],DEF:[],MID:[],FWD:[]};starters.forEach(x=>{const z=x.role==='GK'?'GK':(['LB','CB','RB','LWB','RWB'].includes(x.role)?'DEF':(['CDM','CM','CAM','LM','RM'].includes(x.role)?'MID':'FWD'));groups[z].push(x)});const order=['GK','DEF','MID','FWD'];pitch.innerHTML=order.map(k=>groups[k].length?'<div class="line">'+groups[k].map(x=>'<a class="player" href="/players/'+encodeURIComponent(x.p.slug)+'"><span class="shirt">'+esc(x.p.number||x.role)+'</span><small>'+esc(x.p.name)+'</small></a>').join('')+'</div>':'').join('')||'<div class="empty">The coach has not published a lineup yet.</div>';subs.innerHTML=items.filter(x=>x.status==='sub').map(x=>'<div class="sub"><b>'+esc(x.p.name)+'</b><br><small>'+esc(x.role)+' · #'+esc(x.p.number||'—')+'</small><br><a href="/players/'+encodeURIComponent(x.p.slug)+'">Player profile</a></div>').join('')||'<p class="meta">No substitutes selected.</p>';}catch(e){pitch.textContent='Squad information is temporarily unavailable.';}})();
</script></body></html>
