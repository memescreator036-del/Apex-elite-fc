<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Sponsors | Apex Elite FC</title><meta name="description" content="Meet the partners and sponsors supporting Apex Elite Football Club."><meta name="robots" content="index,follow"><style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.6 Arial,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:22px}a{color:#f5dfb4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#1a1515;border:1px solid #70513b;border-radius:14px;padding:20px;text-align:center}.card img{width:100%;max-width:220px;height:130px;object-fit:contain;background:#fff;border-radius:8px;padding:10px}h1,h2{color:#f5dfb4}</style></head><body><header><a href="/">APEX ELITE FC</a></header><main><h1>Our Sponsors</h1><p>Thank you to the partners supporting Apex Elite Football Club.</p><div id="sponsors" class="grid">Loading sponsors…</div></main><footer><a href="/">Return to homepage</a></footer><script>
(async()=>{const root=document.getElementById('sponsors');try{const r=await fetch('/api/site');if(!r.ok)throw 0;const d=await r.json(),a=(d.sponsors||[]).filter(x=>x.visible);root.innerHTML=a.length?a.map(x=>'<article class="card">'+(x.logo?'<img loading="lazy" src="'+esc(x.logo)+'" alt="'+esc(x.name)+' logo">':'')+'<h2>'+esc(x.name)+'</h2><p>'+esc(x.description||'')+'</p>'+(x.url?'<a rel="noopener" target="_blank" href="'+esc(x.url)+'">Visit sponsor</a>':'')+'</article>').join(''):'<p>Sponsor information will be announced soon.</p>';}catch(e){root.textContent='Sponsor information is temporarily unavailable.';}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}})();
</script></body></html>
