<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apex Elite FC Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px/1.5 system-ui,sans-serif}.box{max-width:22rem;margin:10vh auto;padding:1.5rem;text-align:center}.l{width:6rem;border-radius:50%}
input,select,textarea,button{font:inherit;padding:.6rem .8rem;border-radius:.5rem;border:1px solid #6b5a52;background:#241b1a;color:#f6ebe6;width:100%;margin:.3rem 0}textarea{min-height:7rem}
button{width:auto;background:#d9301f;border:0;cursor:pointer;color:#fff}button.g{background:none;border:1px solid #f5dfb4;color:#f5dfb4}#tb button.on{background:#d9301f;color:#fff;border-color:#d9301f}
header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:#1a1515;position:sticky;top:0;z-index:2}header button{margin:0}
#st{display:flex;flex-wrap:wrap;gap:1.4rem;padding:1rem}#st b{display:block;font-size:1.6rem;color:#f5dfb4}#tb{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 1rem}#tb button{margin:0}
main{padding:1rem;max-width:60rem}.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:34rem}td,th{text-align:left;padding:.5rem;border-bottom:1px solid #3a302d}td select,td button{width:auto;margin:0;padding:.3rem .6rem}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.6rem}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.5rem}.ph button{margin:.2rem 0;padding:.2rem .6rem}label{display:block;margin-top:.6rem;color:#c4b1ab;font-size:.9rem}.ok{color:#8fdc8f}input[type=checkbox]{width:auto;margin:0 .6rem 0 0;vertical-align:middle}.note{color:#c4b1ab;font-size:.9rem}
</style></head><body>
<div id="lg" class="box"><img class="l" src="/logo.jpg" alt=""><h1>Admin</h1><input id="c" type="password" placeholder="Admin code" aria-label="Admin code"><button onclick="go()">Open</button><p id="m"></p></div>
<div id="app" hidden><header><b>Apex Elite FC Admin</b><button class="g" onclick="out()">Log out</button></header><div id="st"></div><div id="tb"></div><main id="v"></main></div>
<script>
var C=sessionStorage.getItem("ac")||"",S=null,T="pl",TABS=[["pl","Players"],["pe","Player SEO"],["sq","Squad & Lineup"],["mn","Menu Manager"],["sp","Sponsors"],["se","SEO Settings"],["py","Payments"],["nw","News"],["gl","Gallery"],["sf","Schedule & fees"],["ac","Account & contact"],["ws","Website"],["sh","Shop"],["od","Orders"],["sc","Security"]];
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function N(n){return"\u20a6"+Number(n).toLocaleString("en-NG")}
async function call(a,d){var r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:C,action:a,data:d||{}})}),j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||"Service not connected");S=j;return j}
async function go(){C=$("c").value;try{await call("load");sessionStorage.setItem("ac",C);$("lg").hidden=true;$("app").hidden=false;view(T)}catch(e){$("m").textContent=e.message}}
function out(){sessionStorage.removeItem("ac");location.reload()}
async function act(a,d,keep){try{await call(a,d);if(!keep)view(T)}catch(e){alert(e.message)}}
function shrink(f,m,q){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.src=r.result};r.readAsDataURL(f)})}
async function up(e){for(var f of e.target.files)await act("addPhoto",{img:await shrink(f,1000,.78)},1);view("gl")}
async function hero(e){if(e.target.files[0])await act("hero",{img:await shrink(e.target.files[0],1800,.82)})}
function sv(keys){var d={};keys.forEach(function(k){d[k]=$(k).value});act("settings",d);}
function lines(id,fn){return $(id).value.split("\n").map(function(l){return l.split("|").map(function(x){return x.trim()})}).filter(function(a){return a[0]}).map(fn)}
async function setPh(id,e){if(e.target.files[0])act("productPhoto",{id:id,img:await shrink(e.target.files[0],800,.78)})}
async function addP(){var f=$("pf").files[0];act("addProduct",{name:$("pn").value,price:$("pv").value,old:$("po").value,sizes:$("ps").value,img:f?await shrink(f,800,.78):""})}
function exp(){var R=[["ID","Name","Age","Group","Parent","Phone","Position","Status"]].concat(S.players.map(function(p){return[p.id,p.name,p.age,p.grp,p.par,p.phone,p.pos,p.st]})),c=R.map(function(r){return r.map(function(v){return'"'+String(v||"").replace(/"/g,'""')+'"'}).join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="players.csv";a.click()}
function fld(k,l,t){return'<label for="'+k+'">'+l+'</label><input id="'+k+'" value="'+esc(S.settings[k])+'" '+(t?'type="'+t+'"':'')+'>'}
var PK={pl:"players",py:"payments",od:"orders",nw:"news",gl:"gallery"};
function ok(k){return S.role==="master"||!!(PK[k]&&S.perms&&S.perms[PK[k]])}
function staffBox(){var P=S.perms||{},L=[["players","See players and mark them Trial or Recruited"],["payments","See and confirm payments"],["orders","See and update shop orders"],["news","Post and remove news"],["gallery","Add and remove gallery photos"]];return'<hr><h3>Staff access</h3><p class="note">Staff open the login by tapping the badge in the website footer 5 times. They can never change bank details, fees, prices, the team photo or codes, and cannot remove players. Staff access is '+(S.hasStaff?'ON':'OFF')+'.</p><label for="sk">Staff code (at least 6 characters)</label><input id="sk" type="password" placeholder="'+(S.hasStaff?'Leave empty to keep the current code':'Set a code to turn staff access on')+'">'+L.map(function(x){return'<label><input type="checkbox" id="pm_'+x[0]+'"'+(P[x[0]]?' checked':'')+'>'+x[1]+'</label>'}).join("")+'<button onclick="saveStaff()">Save staff access</button> '+(S.hasStaff?'<button class="g" onclick="act(\'staff\',{clear:1})">Turn off staff access</button>':'')}
function saveStaff(){var p={};["players","payments","orders","news","gallery"].forEach(function(k){p[k]=$("pm_"+k).checked});act("staff",{code:$("sk").value,perms:p})}
function saveMenu(){act("menu",{items:lines("menuText",function(a){return{label:a[0],href:a[1],visible:String(a[2]||"show").toLowerCase()!=="hide"}})})}
function saveSponsors(){act("sponsors",{items:lines("sponsorText",function(a){return{name:a[0],url:a[1],logo:a[2],description:a[3],visible:String(a[4]||"show").toLowerCase()!=="hide"}})})}
function editProfile(id){var p=(S.playerProfiles||[]).find(function(x){return x.id===id});if(!p)return;["id","name","slug","position","number","team","bio","photo","photoAlt","seoTitle","metaDescription"].forEach(function(k){if($("pf_"+k))$("pf_"+k).value=p[k]||""});$("pf_published").checked=!!p.published;window.scrollTo(0,0)}
function saveProfile(){act("playerProfile",{id:$("pf_id").value,name:$("pf_name").value,slug:$("pf_slug").value,position:$("pf_position").value,number:$("pf_number").value,team:$("pf_team").value,bio:$("pf_bio").value,photo:$("pf_photo").value,photoAlt:$("pf_photoAlt").value,seoTitle:$("pf_seoTitle").value,metaDescription:$("pf_metaDescription").value,published:$("pf_published").checked})}
function clearProfile(){["id","name","slug","position","number","team","bio","photo","photoAlt","seoTitle","metaDescription"].forEach(function(k){if($("pf_"+k))$("pf_"+k).value=""});$("pf_published").checked=true}
function deleteProfile(id){if(confirm("Delete this player profile?"))act("playerProfile",{id:id,del:1})}
function saveSquad(){act("squad",{formation:$("sq_formation").value,coach:$("sq_coach").value,lines:lines("sq_lines",function(a){return{slug:a[0],role:a[1]||"",status:(a[2]||"starter").toLowerCase()}})})}
function saveSeo(){act("seo",{title:$("seo_title").value,description:$("seo_description").value,canonical:$("seo_canonical").value,ogImage:$("seo_ogImage").value})}
var V={
sh:function(){return'<label for="pn">Product name</label><input id="pn" placeholder="e.g. Academy jersey"><label for="pv">Price in naira</label><input id="pv" type="number"><label for="po">Old price (optional, shown crossed out as a promo)</label><input id="po" type="number"><label for="ps">Sizes, separated by commas (leave empty if none)</label><input id="ps" placeholder="S,M,L,XL"><label for="pf">Photo (optional)</label><input id="pf" type="file" accept="image/*"><button onclick="addP()">Add product</button><button class="g" onclick="act(\'seedKit\')">Add sample kit items</button><div class="sc"><table><tr><th>Product</th><th>Price</th><th></th></tr>'+S.products.map(function(p){return'<tr><td>'+esc(p.name)+'<br><small>'+esc(p.sizes)+'</small><br><label style="margin:0">'+(p.img?'Change photo':'Add photo')+'<input type="file" accept="image/*" onchange="setPh(\''+p.id+'\',event)"></label></td><td><input id="pp_'+p.id+'" type="number" value="'+p.price+'" style="width:7rem"><br><small>Old price</small><br><input id="po_'+p.id+'" type="number" value="'+(p.oldPrice||"")+'" style="width:7rem"></td><td><button onclick="act(\'setPrice\',{id:\''+p.id+'\',price:$(\'pp_'+p.id+'\').value,old:$(\'po_'+p.id+'\').value})">Save price</button> <button class="g" onclick="confirm(\'Remove this product?\')&&act(\'delProduct\',{id:\''+p.id+'\'})">Remove</button></td></tr>'}).join("")+'</table></div>'},
od:function(){return'<div class="sc"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+(S.orders.slice().reverse().map(function(o){return'<tr><td>'+o.ref+'<br>'+o.date+'<br>'+esc(o.method)+'</td><td>'+esc(o.name)+'<br>'+esc(o.phone)+'<br>'+esc(o.addr)+'</td><td>'+o.items.map(function(i){return esc(i.name)+(i.size?' ('+esc(i.size)+')':'')+' x'+i.qty}).join('<br>')+'</td><td>'+N(o.total)+'<br><small>Free delivery</small>'+'</td><td><select onchange="act(\'order\',{ref:\''+o.ref+'\',st:this.value})">'+["Pending","Confirmed","Delivered"].map(function(s){return'<option'+(s===o.st?' selected':'')+'>'+s+'</option>'}).join("")+'</select></td></tr>'}).join("")||'<tr><td colspan="5">No orders yet.</td></tr>')+'</table></div>'},
pl:function(){return'<button class="g" onclick="exp()">Export CSV</button><div class="sc"><table><tr><th>ID</th><th>Player</th><th>Group</th><th>Parent / phone</th><th>Status</th><th></th></tr>'+(S.players.map(function(p){return'<tr><td>'+p.id+'</td><td>'+esc(p.name)+(p.age?', '+esc(p.age):'')+(p.pos?'<br>'+esc(p.pos):'')+'</td><td>'+esc(p.grp)+'</td><td>'+esc(p.par)+'<br>'+esc(p.phone)+'</td><td><select onchange="act(\'player\',{id:\''+p.id+'\',st:this.value})">'+["Trial","Recruited","Not selected"].map(function(s){return'<option'+(s===p.st?' selected':'')+'>'+s+'</option>'}).join("")+'</select></td><td><button class="g" onclick="confirm(\'Remove this player?\')&&act(\'player\',{id:\''+p.id+'\',del:1})">Remove</button></td></tr>'}).join("")||'<tr><td colspan="6">No players yet.</td></tr>')+'</table></div>'},
py:function(){return'<div class="sc"><table><tr><th>Receipt</th><th>Player</th><th>For</th><th>Amount</th><th>Method</th><th>Status</th></tr>'+(S.pays.slice().reverse().map(function(y){return'<tr><td>'+y.ref+'<br>'+y.date+'</td><td>'+esc(y.pname)+'<br>'+y.pid+'</td><td>'+esc(y.type)+'</td><td>'+N(y.amt)+'</td><td>'+esc(y.method)+'</td><td>'+(y.st==="Pending"?'<button onclick="act(\'confirm\',{ref:\''+y.ref+'\'})">Confirm</button>':'<span class="ok">Confirmed</span>')+'</td></tr>'}).join("")||'<tr><td colspan="6">No payments yet.</td></tr>')+'</table></div>'},
nw:function(){return'<input id="nt" placeholder="News title"><textarea id="nb" placeholder="News details"></textarea><button onclick="act(\'addNews\',{title:$(\'nt\').value,text:$(\'nb\').value})">Post news</button>'+S.news.map(function(n){return'<p><b>'+esc(n.title)+'</b> <small>'+n.date+'</small><br>'+esc(n.text)+'<br><button class="g" onclick="act(\'delNews\',{id:'+n.id+'})">Remove</button></p>'}).join("")},
gl:function(){return'<label>Add photos (you can pick several)</label><input type="file" accept="image/*" multiple onchange="up(event)"><div class="ph">'+S.photos.map(function(p){return'<div><img src="/api/photo?id='+p.id+'" alt=""><button class="g" onclick="act(\'delPhoto\',{id:\''+p.id+'\'})">Remove</button></div>'}).join("")+'</div>'},
sf:function(){return'<label for="ta">Training days, one per line: Day | Time</label><textarea id="ta">'+esc(S.schedule.map(function(x){return x.d+" | "+x.t}).join("\n"))+'</textarea><label for="tf">Fees, one per line: Name | Amount in naira</label><textarea id="tf">'+esc(S.fees.map(function(x){return x.n+" | "+x.a}).join("\n"))+'</textarea><button onclick="act(\'lists\',{schedule:lines(\'ta\',function(a){return{d:a[0],t:a[1]||\'\'}}),fees:lines(\'tf\',function(a){return{n:a[0],a:a[1]}})})">Save</button>'},
ac:function(){return fld("bankName","Bank name")+fld("acctNo","Account number")+fld("acctName","Account name")+fld("wa","WhatsApp number (digits only, with country code, e.g. 2348012345678)")+fld("phone","Phone number (shown on the website)")+fld("address","Address or training ground location")+'<button onclick="sv([\'bankName\',\'acctNo\',\'acctName\',\'wa\',\'phone\',\'address\'])">Save</button>'},
ws:function(){return fld("tagline","Sentence under the team photo")+'<button onclick="sv([\'tagline\'])">Save</button><label>Team photo on the home page</label><img src="'+(S.settings.heroV?"/api/photo?id=hero&v="+S.settings.heroV:"/hero.jpg")+'" style="max-width:24rem;width:100%;border-radius:.6rem" alt=""><input type="file" accept="image/*" onchange="hero(event)">'},
mn:function(){var a=S.menu||[];return '<h2>Menu Manager</h2><p class="note">One item per line: Label | Link | show/hide. Change line order to reorder the navigation. The nine agreed menu items are included by default.</p><textarea id="menuText" rows="12">'+esc(a.map(function(x){return x.label+' | '+x.href+' | '+(x.visible?'show':'hide')}).join("\n"))+'</textarea><button onclick="saveMenu()">Save menu</button>'},
sp:function(){var a=S.sponsors||[];return '<h2>Sponsor Management</h2><p class="note">One sponsor per line: Name | Website URL | Logo image URL | Description | show/hide. Use an https image URL for each logo.</p><textarea id="sponsorText" rows="12" placeholder="Sponsor name | https://example.com | https://example.com/logo.png | Sponsor description | show">'+esc(a.map(function(x){return [x.name,x.url,x.logo,x.description,x.visible?'show':'hide'].join(' | ')}).join("\n"))+'</textarea><button onclick="saveSponsors()">Save sponsors</button><p><a href="/sponsors.html" target="_blank">Preview public sponsors page</a></p>'},
pe:function(){var a=S.playerProfiles||[];return '<h2>Player SEO Manager</h2><p class="note">Create a public profile for each player. The player name, URL, biography, photo text and Google metadata can be entered or edited here. Only published profiles appear publicly.</p><input id="pf_id" type="hidden"><label>Player full name</label><input id="pf_name" placeholder="Player full name"><label>Profile URL slug</label><input id="pf_slug" placeholder="e.g. john-doe"><label>Position</label><input id="pf_position" placeholder="e.g. Striker"><label>Squad number</label><input id="pf_number" placeholder="e.g. 10"><label>Team / age group</label><input id="pf_team" placeholder="e.g. U16"><label>Biography</label><textarea id="pf_bio" rows="5" placeholder="Player biography and achievements"></textarea><label>Player photo URL</label><input id="pf_photo" placeholder="https://... or /images/player.jpg"><label>Photo alt text</label><input id="pf_photoAlt" placeholder="Describe the player photo"><label>SEO title</label><input id="pf_seoTitle" placeholder="Player Name | Apex Elite FC"><label>Meta description</label><textarea id="pf_metaDescription" rows="3" placeholder="Short description for search results"></textarea><label><input type="checkbox" id="pf_published" checked> Publish this player profile</label><button onclick="saveProfile()">Save player profile</button> <button class="g" onclick="clearProfile()">Clear form</button><h3>Saved player profiles</h3><div class="sc"><table><tr><th>Player</th><th>SEO URL</th><th>Published</th><th>Actions</th></tr>'+a.map(function(x){return '<tr><td>'+esc(x.name)+'<br><small>'+esc(x.position)+'</small></td><td>/players/'+esc(x.slug)+'</td><td>'+(x.published?'Yes':'Draft')+'</td><td><button data-id="'+esc(x.id)+'" onclick="editProfile(this.dataset.id)">Edit</button> <button class="g" data-id="'+esc(x.id)+'" onclick="deleteProfile(this.dataset.id)">Delete</button></td></tr>'}).join('')+'</table></div>'},
sq:function(){var q=S.squad||{formation:"4-3-3",coach:"",lineup:[]};return '<h2>Coach-controlled squad lineup</h2><p class="note">Create player profiles first in Player SEO. Then enter one player per line using: player-profile-slug | pitch-position | starter/sub. Example: john-doe | GK | starter. Positions can be GK, LB, CB, RB, CDM, CM, CAM, LW, RW, ST. This controls the public eFootball-style lineup.</p><label>Formation</label><select id="sq_formation">'+["4-3-3","4-4-2","4-2-3-1","3-5-2","3-4-3","4-1-4-1"].map(function(f){return '<option'+(q.formation===f?' selected':'')+'>'+f+'</option>'}).join('')+'</select><label>Head coach</label><input id="sq_coach" value="'+esc(q.coach||'')+'" placeholder="Coach name"><label>Lineup entries</label><textarea id="sq_lines" rows="12" placeholder="player-slug | GK | starter">'+esc((q.lineup||[]).map(function(x){return x.slug+' | '+x.role+' | '+x.status}).join('\n'))+'</textarea><button onclick="saveSquad()">Save squad &amp; lineup</button><p class="note"><a href="/squad.html" target="_blank">Preview public squad</a></p>'},
se:function(){var x=S.seo||{};return '<h2>Website SEO Settings</h2><p class="note">These settings control the homepage search title, description, canonical base URL and social preview image. Sitemap and robots.txt are generated by the API.</p><label>Homepage SEO title</label><input id="seo_title" value="'+esc(x.title||'')+'"><label>Homepage meta description</label><textarea id="seo_description" rows="4">'+esc(x.description||'')+'</textarea><label>Canonical website URL</label><input id="seo_canonical" placeholder="https://your-domain.com" value="'+esc(x.canonical||'')+'"><label>Social sharing image URL</label><input id="seo_ogImage" placeholder="https://.../share-image.jpg" value="'+esc(x.ogImage||'')+'"><button onclick="saveSeo()">Save SEO settings</button><p class="note">After deployment, check <a href="/sitemap.xml" target="_blank">sitemap.xml</a> and <a href="/robots.txt" target="_blank">robots.txt</a>.</p>'},
sc:function(){return'<label for="nc">New admin code (at least 6 characters)</label><input id="nc" type="password"><button onclick="var n=$(\'nc\').value;if(n)act(\'code\',{code:n}).then(function(){C=n;sessionStorage.setItem(\'ac\',n)})">Change code</button>'+staffBox()}};
function view(t){if(!ok(t)){var f=TABS.filter(function(x){return ok(x[0])})[0];if(!f){$("v").innerHTML="<p>No access has been given to this code yet.</p>";$("tb").innerHTML="";return}t=f[0]}T=t;var inc=S.pays.filter(function(y){return y.st==="Confirmed"}).reduce(function(s,y){return s+y.amt},0)+S.orders.filter(function(o){return o.st!=="Pending"}).reduce(function(s,o){return s+o.total},0);
$("st").innerHTML='<div><b>'+S.players.length+'</b>Players</div><div><b>'+S.players.filter(function(p){return p.st==="Recruited"}).length+'</b>Recruited</div><div><b>'+S.pays.filter(function(y){return y.st==="Pending"}).length+'</b>Pending payments</div>'+(S.role==="master"?'<div><b>'+N(inc)+'</b>Confirmed income</div>':'');
$("tb").innerHTML=TABS.filter(function(x){return ok(x[0])}).map(function(x){return'<button class="g'+(x[0]===t?' on':'')+'" onclick="view(\''+x[0]+'\')">'+x[1]+'</button>'}).join("");$("v").innerHTML=V[t]();if(S.role!=="master"&&t==="pl")Array.prototype.forEach.call($("v").querySelectorAll("button"),function(b){if(b.textContent==="Remove")b.remove()});document.querySelector("header b").textContent=S.role==="master"?"Apex Elite FC Master Admin":"Apex Elite FC Staff"}
if(C){$("c").value=C;go()}
</script></body></html>
