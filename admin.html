<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apex Elite FC Admin Reset</title>
<style>body{margin:0;background:#0d0b0b;color:#f6ebe6;font:16px system-ui,sans-serif}.box{max-width:26rem;margin:10vh auto;padding:1.4rem}input,button{display:block;width:100%;box-sizing:border-box;padding:.75rem;margin:.6rem 0;border-radius:.5rem;border:1px solid #6b5a52;background:#241b1a;color:#fff}button{background:#d9301f;border:0}small{color:#c4b1ab}</style></head>
<body><div class="box"><h1>Apex Elite FC</h1><h2>Main Admin Reset</h2><p><small>Use only after the matching secure API recovery patch is installed and the private ADMIN_RECOVERY_CODE environment variable is set in Netlify. Do not share either code.</small></p>
<label>Private recovery code</label><input id="recovery" type="password" autocomplete="off">
<label>New Main Admin code (at least 12 characters)</label><input id="newcode" type="password" autocomplete="new-password">
<button onclick="resetAdmin()">Set new Main Admin code</button><p id="msg"></p></div>
<script>
async function resetAdmin(){
 const recoveryCode=document.getElementById("recovery").value;
 const newAdminCode=document.getElementById("newcode").value;
 const msg=document.getElementById("msg");
 if(newAdminCode.length<12){msg.textContent="Use at least 12 characters.";return}
 msg.textContent="Working...";
 try{
  const r=await fetch("/api/admin-recovery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({recoveryCode,newAdminCode})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(j.error||"Reset failed");
  msg.textContent="Main Admin code updated. Delete public/admin-reset.html from GitHub now, then sign in at /admin.html.";
 }catch(e){msg.textContent=e.message}
}
</script></body></html>
